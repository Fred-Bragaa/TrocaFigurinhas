<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>
        ⚽ Cruzamento de Figurinhas
    </title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family:
                'Inter',
                sans-serif;

            background:

                radial-gradient(circle at top left,
                    #1e3a8a 0%,
                    transparent 35%),

                linear-gradient(135deg,
                    #020617,
                    #0f172a,
                    #111827);

            min-height: 100vh;

            padding:

                20px;

            color: white;

        }

        .container {

            max-width:
                1400px;

            margin: auto;

        }

        .header {

            text-align: center;

            margin-bottom:
                20px;

        }

        .header h1 {

            font-size:
                clamp(2rem,
                    5vw,
                    3rem);

            font-weight:
                800;

        }

        .header p {

            color:
                #94a3b8;

            margin-top:
                6px;

        }

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3,
                    1fr);

            gap: 12px;

            margin-bottom:
                20px;

        }

        .stat {

            background:
                rgba(15,
                    23,
                    42,
                    .85);

            border:
                1px solid rgba(255,
                    255,
                    255,
                    .05);

            padding:
                16px;

            border-radius:
                20px;

            text-align: center;

        }

        .stat span {

            display: block;

            font-size:
                2rem;

            font-weight:
                800;

            color:
                #3b82f6;

        }

        .stat small {

            color:
                #94a3b8;

        }

        .grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                20px;

        }

        .card {

            background:
                rgba(15,
                    23,
                    42,
                    .85);

            padding:
                22px;

            border-radius:
                24px;

            position:
                relative;

        }

        .card h2 {

            margin-bottom:
                12px;

        }

        .paste {

            position:
                absolute;

            right:
                18px;

            top:
                18px;

            padding:
                8px 14px;

            border: none;

            border-radius:
                12px;

            cursor: pointer;

            background:
                #1d4ed8;

            color: white;

        }

        textarea {

            width:
                100%;

            height:
                420px;

            background:
                #020617;

            border: none;

            outline: none;

            resize: none;

            border-radius:
                18px;

            padding:
                18px;

            color: white;

            font-size:
                15px;

        }

        .actions {

            display: flex;

            justify-content: center;

            gap:
                16px;

            margin:
                24px 0;

        }

        button {

            padding:
                16px 28px;

            border: none;

            cursor: pointer;

            border-radius:
                18px;

            font-weight:
                700;

        }

        .primary {

            background:
                #2563eb;

            color: white;

        }

        .secondary {

            background:
                #1e293b;

            color: white;

        }

        .result {

            background:
                #020617;

            padding:
                20px;

            border-radius:
                24px;

        }

        .output {

            width: 100%;

            height:
                320px;

            background:
                transparent;

            color:
                #22c55e;

            border: none;

            resize: none;

        }

        .floating {

            display: none;

        }

        .footer {

            margin-top:
                30px;

            text-align: center;

            color:
                #64748b;

        }

        @media(max-width:900px) {

            .grid {

                grid-template-columns:
                    1fr;

            }

            textarea {

                height:
                    260px;

            }

            .floating {

                display: flex;

                position:
                    fixed;

                bottom:
                    20px;

                left:
                    50%;

                transform:
                    translateX(-50%);

                z-index:
                    999;

            }

            .floating button {

                box-shadow:
                    0 10px 40px rgba(0,
                        0,
                        0,
                        .5);

            }

        }
    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>
                ⚽ Cruzamento de Figurinhas
            </h1>

            <p>
                Copa do Mundo 2026
            </p>

        </div>

        <div class="stats">

            <div class="stat">
                <span id="countMine">0</span>
                <small>📦 Repetidas</small>
            </div>

            <div class="stat">
                <span id="countFriend">0</span>
                <small>🎯 Faltantes</small>
            </div>

            <div class="stat">
                <span id="countResult">0</span>
                <small>🤝 Trocas</small>
            </div>

        </div>

        <div class="grid">

            <div class="card">

                <button class="paste" onclick="pasteText('mine')">

                    📋 Colar

                </button>

                <h2>
                    🔥 Suas repetidas
                </h2>

                <textarea id="mine">
</textarea>

            </div>

            <div class="card">

                <button class="paste" onclick="pasteText('friend')">

                    📋 Colar

                </button>

                <h2>
                    🎯 Faltantes do amigo
                </h2>

                <textarea id="friend">
</textarea>

            </div>

        </div>

        <div class="actions">

            <button class="primary" onclick="crossStickers()">

                ⚽ Cruzar

            </button>

            <button class="secondary" onclick="clearAll()">

                🗑 Limpar

            </button>

        </div>

        <div class="floating">

            <button class="primary" onclick="crossStickers()">

                ⚽ Cruzar

            </button>

        </div>

        <div id="result" class="result">

            Resultado aparecerá aqui

        </div>

        <div class="footer">

            Desenvolvido por Frederico Braga

        </div>

    </div>
    <script>

        function normalizeSticker(
            prefix,
            number
        ) {

            return `${prefix
                    .toUpperCase()
                } ${parseInt(
                    number
                )
                }`;

        }

        function extractStickers(
            text
        ) {

            const result = [];

            const ignored = [

                "pg.",
                "história",
                "coleção",
                "bola e países",
                "extra stickers",
                "repetidas",
                "faltantes"

            ];

            const lines =
                text
                    .split(
                        "\n"
                    );

            for (
                let raw of lines
            ) {

                let line =
                    raw.trim();

                if (
                    !line
                )
                    continue;

                let lower =
                    line
                        .toLowerCase();

                if (
                    ignored.some(
                        t =>
                            lower.includes(
                                t
                            )
                    )
                ) {
                    continue;
                }

                if (
                    line.includes(
                        ":"
                    )
                ) {

                    let [
                        left,
                        right
                    ] =
                        line.split(
                            ":"
                        );

                    let match =
                        left.match(
                            /\b([A-Z]{2,6})\b/
                        );

                    if (
                        match
                    ) {

                        let prefix =
                            match[1];

                        let nums =
                            right.match(
                                /\d{1,3}/g
                            );

                        if (
                            nums
                        ) {

                            nums.forEach(
                                n => {

                                    result.push(

                                        normalizeSticker(
                                            prefix,
                                            n
                                        )

                                    );

                                });

                        }

                        continue;

                    }

                }

                let compact = [

                    ...
                    line.matchAll(
                        /\b([A-Z]{2,6})\s*(\d{1,3})\b/g
                    )

                ];

                compact.forEach(
                    m => {

                        result.push(

                            normalizeSticker(
                                m[1],
                                m[2]
                            )

                        );

                    });

                let extras = [

                    ...
                    line.matchAll(
                        /\b(REGU|BRON|PRAT|OURO)\b/gi
                    )

                ];

                extras.forEach(
                    e => {

                        result.push(
                            e[1]
                                .toUpperCase()
                        );

                    });

            }

            return [

                ...new Set(
                    result
                )

            ];

        }

        function groupResults(
            list
        ) {

            const groups = {};

            list.forEach(
                item => {

                    if (
                        item.includes(
                            " "
                        )
                    ) {

                        const [
                            prefix,
                            number
                        ] =
                            item.split(
                                " "
                            );

                        if (
                            !groups[
                            prefix
                            ]
                        ) {

                            groups[
                                prefix
                            ] = [];

                        }

                        groups[
                            prefix
                        ]
                            .push(
                                parseInt(
                                    number
                                )
                            );

                    }

                });

            return groups;

        }

        function updateCounters() {

            const mine =

                extractStickers(

                    document
                        .getElementById(
                            "mine"
                        )
                        .value

                );

            const friend =

                extractStickers(

                    document
                        .getElementById(
                            "friend"
                        )
                        .value

                );

            const cross =

                mine.filter(

                    x =>
                        friend.includes(
                            x
                        )

                );

            document
                .getElementById(
                    "countMine"
                )
                .innerText =
                mine.length;

            document
                .getElementById(
                    "countFriend"
                )
                .innerText =
                friend.length;

            document
                .getElementById(
                    "countResult"
                )
                .innerText =
                cross.length;

        }

        function crossStickers() {

            const mine =

                extractStickers(

                    document
                        .getElementById(
                            "mine"
                        )
                        .value

                );

            const friend =

                extractStickers(

                    document
                        .getElementById(
                            "friend"
                        )
                        .value

                );

            if (
                mine.length === 0
            ) {

                alert(
                    "Insira suas repetidas"
                );

                return;

            }

            if (
                friend.length === 0
            ) {

                alert(
                    "Insira as faltantes"
                );

                return;

            }

            const result =

                mine.filter(

                    x =>
                        friend.includes(
                            x
                        )

                );

            renderResult(
                result
            );

            updateCounters();

        }

        function renderResult(
            result
        ) {

            const box =

                document
                    .getElementById(
                        "result"
                    );

            if (
                result.length === 0
            ) {

                box.innerHTML = `

<div
style="
color:#94a3b8;
text-align:center;
padding:40px;
"
>

Nenhuma figurinha encontrada

</div>

`;

                return;

            }

            const grouped =
                groupResults(
                    result
                );

            let text = "";

            let total = 0;

            Object
                .keys(
                    grouped
                )

                .sort()

                .forEach(
                    country => {

                        const values =

                            grouped[
                            country
                            ];

                        values.sort(
                            (a, b) =>
                                a - b
                        );

                        text +=

                            `${country}
${values.join(", ")}

`;

                        total +=
                            values.length;

                    }

                );

            text += `

TOTAL:
${total}
figurinha(s)

`;

            box.innerHTML = `

<textarea

readonly

class="output"

>${text}</textarea>

`;

        }

        async function pasteText(
            target
        ) {

            try {

                const text =

                    await navigator
                        .clipboard
                        .readText();

                const el =

                    document
                        .getElementById(
                            target
                        );

                if (
                    el.value.trim()
                ) {

                    el.value +=
                        "\n" +
                        text;

                } else {

                    el.value =
                        text;

                }

                updateCounters();

            } catch {

                alert(

                    "Não foi possível colar automaticamente"

                );

            }

        }

        function clearAll() {

            document
                .getElementById(
                    "mine"
                )
                .value = "";

            document
                .getElementById(
                    "friend"
                )
                .value = "";

            document
                .getElementById(
                    "result"
                )
                .innerHTML =

                `

Resultado aparecerá aqui

`;

            updateCounters();

        }

        document

            .getElementById(
                "mine"
            )

            .addEventListener(

                "input",

                updateCounters

            );

        document

            .getElementById(
                "friend"
            )

            .addEventListener(

                "input",

                updateCounters

            );

        updateCounters();

    </script>

</body>

</html>
